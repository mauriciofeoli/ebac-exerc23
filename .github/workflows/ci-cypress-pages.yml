name: CI Cypress Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes Cypress
        id: cypress
        continue-on-error: true
        run: |
          mkdir -p cypress/reports/junit
          npx cypress run --reporter junit --reporter-options "mochaFile=cypress/reports/junit/results-[hash].xml,toConsole=true"

      - name: Gerar relatorio HTML
        if: always()
        run: |
          mkdir -p site
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const junitDir = path.join('cypress', 'reports', 'junit')
          const files = fs.existsSync(junitDir)
            ? fs.readdirSync(junitDir).filter((file) => file.endsWith('.xml')).sort()
            : []

          const rows = files.length
            ? files.map((file) => {
                const xml = fs.readFileSync(path.join(junitDir, file), 'utf8')
                const testsMatch = xml.match(/tests="(\d+)"/)
                const failuresMatch = xml.match(/failures="(\d+)"/)
                const total = testsMatch ? Number(testsMatch[1]) : 0
                const failed = failuresMatch ? Number(failuresMatch[1]) : 0
                return `<tr><td>${file}</td><td>${total}</td><td>${total - failed}</td><td>${failed}</td></tr>`
              }).join('')
            : '<tr><td colspan="4">Nenhum relatorio gerado ainda.</td></tr>'

          const html = `<!DOCTYPE html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Relatorio Cypress - Modulo 23</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7fb; color: #1f2937; }
                .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
                h1 { margin-top: 0; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th, td { border: 1px solid #dbe3ee; padding: 12px 16px; text-align: left; }
                th { background: #e5ecf8; }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>Relatorio de testes Cypress</h1>
                <p>Projeto: EBAC Exercicio Modulo 23</p>
                <table>
                  <thead><tr><th>Arquivo</th><th>Total</th><th>Passaram</th><th>Falharam</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </body>
          </html>`

          fs.writeFileSync(path.join('site', 'index.html'), html, 'utf8')
          NODE

      - name: Upload do relatorio como artefato
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4